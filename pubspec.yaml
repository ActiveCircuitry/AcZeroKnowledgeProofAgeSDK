name: ac_zero_knowledge_proof_age_sdk
description: Active Circuitry Zero Knowledge Age Verification SDK - Privacy-preserving age verification using Zero-Knowledge Proofs (Groth16, PLONK) for Android applications.
version: 0.1.0
homepage: https://activecircuitry.com
repository: https://github.com/active-circuitry/ac-zkp-age-sdk
issue_tracker: https://github.com/active-circuitry/ac-zkp-age-sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0
  ffi: ^2.1.0
  json_annotation: ^4.8.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  mockito: ^5.4.0
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        package: com.activecircuitry.zkp.age_sdk
        pluginClass: AcZeroKnowledgeProofAgeSdkPlugin
      
# Company information
company: Active Circuitry Private Ltd.
copyright: "Copyright (c) 2026 Active Circuitry Private Ltd."
